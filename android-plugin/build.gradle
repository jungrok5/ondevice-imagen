// Top-level build file; per-module overrides live in
// draw_moment_plugin/build.gradle.
plugins {
    id 'com.android.library' version '8.5.2' apply false
    // Godot 4.6.2 Android API ships compiled with Kotlin 2.1, so this
    // module must consume it with a >= 2.1 compiler. (Same constraint
    // hit by the WaterBloom plugin on the same Godot version.)
    id 'org.jetbrains.kotlin.android' version '2.1.0' apply false
}
