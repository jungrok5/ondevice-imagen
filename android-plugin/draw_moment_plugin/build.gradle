plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jungrok5.drawmoment'
    compileSdk 34

    defaultConfig {
        minSdk 24            // Android 7 — covers Note 10+ and newer
        targetSdk 34
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // Godot 4 plugin SDK — provides GodotPlugin / @UsedByGodot / SignalInfo.
    // compileOnly: the Godot runtime supplies it at app load time.
    // Pinned to match the Godot Engine version that scripts/godot.ps1
    // resolves (winget-installed 4.6.2 stable).
    compileOnly "org.godotengine:godot:4.6.2.stable"

    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.work:work-runtime-ktx:2.9.1"

    // ONNX Runtime Android — Phase 2 Step 5. Pinned to 1.19.2 to match
    // the PC Python side (where models/onnx/sd15_drawing_nty_scale0.8/
    // was exported with onnxruntime 1.19.2). Full build, not -mobile,
    // so all SD ops are guaranteed available; we'll switch to the
    // -mobile build later if APK size becomes a concern.
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.19.2"
}
