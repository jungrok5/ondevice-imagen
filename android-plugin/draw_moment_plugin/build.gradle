plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jungrok5.drawmoment'
    compileSdk 34

    defaultConfig {
        minSdk 24            // Android 7 — covers Note 10+ and newer
        targetSdk 34
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // Godot 4 plugin SDK — provides GodotPlugin / @UsedByGodot / SignalInfo.
    // compileOnly: the Godot runtime supplies it at app load time.
    // Pinned to match the Godot Engine version that scripts/godot.ps1
    // resolves (winget-installed 4.6.2 stable).
    compileOnly "org.godotengine:godot:4.6.2.stable"

    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.work:work-runtime-ktx:2.9.1"

    // ONNX Runtime Mobile (Android) — phase 2 wires this in. Pinned now
    // so the build graph is ready when InferenceWorker switches from the
    // fake delay to a real Session.run() call.
    // implementation "com.microsoft.onnxruntime:onnxruntime-android:1.18.0"
}
